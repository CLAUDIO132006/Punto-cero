name: Build PS2 ELF

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: apk add --no-cache make build-base git python3
      - name: Ver archivos
        run: ls -R src assets tools | head -80
      - name: Compilar
        run: make clean all
      - name: Subir ELF
        uses: actions/upload-artifact@v4
        with:
          name: PUNTO_CERO-ELF
          path: punto-cero.elf
